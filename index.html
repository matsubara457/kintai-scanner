<!DOCTYPE html>
<html lang="ja" data-tod="night">
<head>
<meta charset="UTF-8" />
<!-- 許すのは同一オリジンのスクリプトと通信だけ。インラインのスクリプトは動かさない（script-src 'self'）。Google Fonts も使わない -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>ナハトX勤怠</title>
<style>
  /* ===== 時間帯で変わるパレット（常時オンの時計が「いまが何時ごろか」を色で語る） ===== */
  :root {
    --g1: #10192e; --g2: #253a63; --accent: #6fd6ff; --accent-soft: rgba(111,214,255,.16);
    --ink: #ffffff; --dim: rgba(255,255,255,.62); --faint: rgba(255,255,255,.30);
    --card: rgba(255,255,255,.07); --card-line: rgba(255,255,255,.14);
    --grad-shift: 22s;
    --vh: 1vh;
    /* 白地のQR（余白込み）の一辺。横向きは画面の高さの6割前後、幅が足りない画面では幅で頭打ち */
    --qr: min(calc(var(--vh) * 60), 46vw);
    --pad: clamp(14px, calc(var(--vh) * 2.4), 26px);
    /* 外部フォントは使わない（読み込み待ちで起動が遅れたり、4:00の再読み込みの成否が外部サービスに左右されたりするため） */
    --font-text: "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
    --font-digits: -apple-system, "SF Pro Display", system-ui, sans-serif;
  }
  @supports (height: 1dvh) { :root { --vh: 1dvh; } }
  /* 縦向き: 上に時計、下にQR */
  @media (orientation: portrait) { :root { --qr: min(calc(var(--vh) * 40), 76vw); } }
  :root[data-tod="dawn"] { --g1:#43305f; --g2:#c68a77; --accent:#ffd0a8; --accent-soft:rgba(255,208,168,.18); }
  :root[data-tod="day"]  { --g1:#1f4a78; --g2:#5aa6cf; --accent:#a6f2df; --accent-soft:rgba(166,242,223,.18); }
  :root[data-tod="dusk"] { --g1:#5f3550; --g2:#d98a4e; --accent:#ffd27a; --accent-soft:rgba(255,210,122,.18); }
  :root[data-tod="night"]{ --g1:#0d1526; --g2:#233960; --accent:#6fd6ff; --accent-soft:rgba(111,214,255,.16); }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; min-height: 100dvh; overflow: hidden;
    background: var(--g1); color: var(--ink);
    font-family: var(--font-text);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    touch-action: manipulation;
  }
  body {
    position: relative;
    background:
      radial-gradient(120% 80% at 18% 12%, color-mix(in srgb, var(--g2) 55%, transparent) 0%, transparent 60%),
      radial-gradient(130% 90% at 85% 90%, color-mix(in srgb, var(--accent) 22%, transparent) 0%, transparent 55%),
      linear-gradient(155deg, var(--g1), var(--g2));
    transition: background 2.5s ease;
  }
  /* ゆっくり漂う光（常時オンでも眠くならない程度の微細な動き） */
  .aura { position: fixed; inset: -20%; z-index: 0; pointer-events: none;
    background: radial-gradient(40% 40% at 50% 50%, var(--accent-soft), transparent 70%);
    animation: drift var(--grad-shift) ease-in-out infinite; opacity: .9; }
  @keyframes drift {
    0%   { transform: translate(-8%, -6%) scale(1.05); }
    50%  { transform: translate(10%, 8%) scale(1.25); }
    100% { transform: translate(-8%, -6%) scale(1.05); }
  }

  /* ===== 画面全体（焼き付き対策で1分ごとに数pxずらす対象） ===== */
  .shift { position: fixed; inset: 0; z-index: 1; }
  .brand { position: absolute; top: max(1.1rem, env(safe-area-inset-top)); left: 0; right: 0;
    text-align: center; font-size: .74rem; letter-spacing: .45em; color: var(--faint); }
  .brand b { color: var(--accent); font-weight: 700; }

  /* 横向き: 左に時計・右にQR / 縦向き: 上に時計・下にQR */
  .stage { position: absolute; inset: 0; display: grid; align-items: center; justify-items: center;
    grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr); column-gap: 3vw;
    padding: calc(max(1.1rem, env(safe-area-inset-top)) + 1.7rem) max(4vw, env(safe-area-inset-right))
             max(2.4vh, env(safe-area-inset-bottom)) max(4vw, env(safe-area-inset-left)); }
  @media (orientation: portrait) {
    .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; column-gap: 0; row-gap: 2vh; }
  }

  /* ===== 時計 ===== */
  /* 行の高さ(1fr)いっぱいに広げ、その寸法（cqw/cqh）で時計の大きさを決める。縦向きでもQRの残りの高さに収まる */
  .clock-pane { width: 100%; height: 100%; min-width: 0; min-height: 0; container-type: size;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .greet { font-size: clamp(1rem, 2.8vw, 1.7rem); font-size: clamp(1rem, min(5.4cqw, calc(var(--vh) * 3.2)), 1.7rem);
    color: var(--dim); font-weight: 500; letter-spacing: .06em; margin-bottom: clamp(.4rem, 1.5vh, 1rem); }
  .clock { font-family: var(--font-digits); font-weight: 200; line-height: .9;
    font-size: min(11vw, calc(var(--vh) * 26)); font-size: min(27cqw, calc((100cqh - 7.5rem) / .95));   /* 前者はコンテナ単位が使えない環境向けの控え */
    letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap;
    display: flex; align-items: baseline; justify-content: center; }
  .clock .colon { animation: blink 2s steps(1) infinite; margin: 0 .06em; font-weight: 200; }
  .clock .sec { font-size: .26em; font-weight: 300; color: var(--accent); align-self: flex-start;
    margin-left: .18em; margin-top: .4em; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: .28; } }
  .date { margin-top: clamp(.6rem, 2vh, 1.4rem); font-size: clamp(1rem, 3.4vw, 1.9rem);
    font-size: clamp(1rem, min(4.6cqw, calc(var(--vh) * 2.8)), 1.9rem);
    color: var(--dim); font-weight: 500; letter-spacing: .12em; }

  /* 小さなバッジ（オフライン・時計のずれ）。時計の並びに入れないので、出入りで何も動かない。
     横向き: 左上に縦に積む（左の列は時計の上が空いていて、右のQRカードにも届かない）。
     縦向き: 画面の幅いっぱいに積む。ブランド名・あいさつの行を使うので、バッジが出ている間だけその2つを隠す
     （場所は空けたまま＝時計・日付・QRカードは動かず、バッジも時計の数字には届かない） */
  .badges { position: absolute; top: max(.9rem, env(safe-area-inset-top)); left: max(1.2rem, env(safe-area-inset-left));
    max-width: calc(50vw - 6.5rem); display: flex; flex-direction: column; align-items: flex-start; gap: .4rem; }
  .badge { display: none; align-items: flex-start; gap: .55em; padding: .38em 1em; border-radius: 1rem;
    background: var(--card); border: 1px solid var(--card-line);
    color: var(--dim); font-size: clamp(.72rem, calc(var(--vh) * 1.8), .95rem); font-weight: 700; letter-spacing: .03em; line-height: 1.5; }
  .badge.on { display: inline-flex; }
  .badge::before { content: ''; width: .6em; height: .6em; margin-top: .55em; border-radius: 50%; background: #ffc857; flex: none; }
  .badge.skew { color: var(--ink); }
  .badge.skew::before { background: #ff8a65; }
  @media (orientation: portrait) {
    .badges { right: max(1.2rem, env(safe-area-inset-right)); max-width: none; align-items: center; }
    .badge { font-size: clamp(.68rem, calc(var(--vh) * 1.25), .8rem); }
    .shift:has(.badge.on) :is(.brand, .greet) { visibility: hidden; }
  }

  /* ===== QRカード（常時オンなので、背面が動く backdrop-filter は使わず負荷を抑える） ===== */
  .qr-card { width: calc(var(--qr) + 2 * var(--pad) + 2px); padding: var(--pad); border-radius: 36px;   /* +2px は枠線の分（border-box） */
    background: var(--card); border: 1px solid var(--card-line); box-shadow: 0 30px 70px rgba(0,0,0,.35);
    container-type: inline-size;   /* 中の文字をカードの幅に合わせて決める（cqw） */
    display: flex; flex-direction: column; align-items: stretch; gap: clamp(.5rem, calc(var(--vh) * 1.5), 1rem); }
  /* QRは常に白地に黒（時間帯の配色に左右されない）。余白は canvas 側で4モジュール分、台座の白がさらに足される */
  .qr-frame { width: var(--qr); height: var(--qr); background: #fff; border-radius: clamp(14px, calc(var(--vh) * 3), 26px);
    display: grid; place-items: center; overflow: hidden; }
  .qr-frame canvas { display: block; max-width: 100%; max-height: 100%; image-rendering: pixelated; }
  .qr-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; }
  .qr-bar > i { display: block; width: 100%; height: 100%; border-radius: 3px; background: var(--accent);
    box-shadow: 0 0 10px var(--accent-soft); transform-origin: left center; transform: scaleX(1);
    transition: transform 1s linear; }
  .qr-cta { text-align: center; font-weight: 900; letter-spacing: .04em; margin-top: .1rem; white-space: nowrap;
    font-size: clamp(1rem, calc(var(--vh) * 2.7), 1.6rem); font-size: clamp(1rem, min(calc(var(--vh) * 2.7), 5.4cqw), 1.6rem); }   /* 1行に収める */
  .qr-note { text-align: center; color: var(--dim); font-weight: 500; line-height: 1.7;
    font-size: clamp(.72rem, calc(var(--vh) * 1.75), .98rem); }
  /* Safari のタブで開いているときだけ出す案内（ホーム画面アプリでは出さない） */
  .qr-home { margin-top: .45rem; color: var(--accent); font-weight: 700; }
  .qr-home .nb { display: inline-block; }   /* 句の途中（「アドレス欄」など）で折り返さない */

  /* 案内・エラー（QRの代わりに同じ場所へ出す） */
  .qr-msg { display: none; width: var(--qr); min-height: calc(var(--qr) * .62); padding: 1rem .6rem;
    flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: .9rem; }
  .qr-msg .icon { font-size: clamp(2.4rem, calc(var(--vh) * 7), 4rem); line-height: 1; }
  .qr-msg .title { font-weight: 900; line-height: 1.5; font-size: clamp(1.05rem, calc(var(--vh) * 2.8), 1.7rem); }
  .qr-msg .body, .qr-msg .hint { font-weight: 500; line-height: 1.85; max-width: 34em; line-break: strict; text-wrap: balance; }
  .qr-msg .body { color: var(--dim); font-size: clamp(.85rem, calc(var(--vh) * 2), 1.15rem); }
  .qr-msg .hint { color: rgba(255,255,255,.52); font-size: clamp(.78rem, calc(var(--vh) * 1.75), 1rem); margin-top: -.3rem; }
  .qr-msg .body:empty, .qr-msg .hint:empty { display: none; }
  .qr-card.is-msg .qr-msg { display: flex; }
  .qr-card.is-msg .qr-frame, .qr-card.is-msg .qr-bar, .qr-card.is-msg .qr-cta, .qr-card.is-msg .qr-note { display: none; }
  .qr-card.is-err .qr-msg .title { color: #ffb4ae; }

  @media (prefers-reduced-motion: reduce) {
    .aura, .clock .colon { animation: none; }
    body { transition: none; }
    .qr-bar > i { transition: none; }
  }
</style>
</head>
<body>
  <div class="aura"></div>

  <div class="shift" id="shift">
    <div class="brand">ナハト<b>X</b>勤怠</div>
    <div class="badges">
      <div class="badge offline" id="offline">iPadはオフライン（QRの表示は続けます）</div>
      <div class="badge skew" id="skew"></div>
    </div>

    <main class="stage">
      <!-- 左（縦向きは上）: 時計 -->
      <section class="clock-pane">
        <div class="greet" id="greet">こんばんは</div>
        <div class="clock">
          <span id="hh">--</span><span class="colon">:</span><span id="mm">--</span><span class="sec" id="ss">--</span>
        </div>
        <div class="date" id="date">----年--月--日 -曜日</div>
      </section>

      <!-- 右（縦向きは下）: QRのカード -->
      <section class="qr-card" id="qrCard">
        <div class="qr-frame" id="qrFrame">
          <canvas id="qr" role="img" aria-label="30秒ごとに変わる打刻用のQRコード"></canvas>
        </div>
        <div class="qr-bar" aria-hidden="true"><i id="bar"></i></div>
        <div class="qr-cta">スマホのカメラで読み取ってください</div>
        <div class="qr-note">
          <div id="noteCut"></div>
          <div>読み取ったあと、SmartHRで打刻</div>
          <div>はじめての人は会社のGoogleアカウントでログイン</div>
          <div class="qr-home" id="homeNote" hidden><span class="nb">ホーム画面に追加して、アイコンから開いてください</span><span class="nb">（アドレス欄に鍵が残らないようにするため）</span></div>
        </div>
        <div class="qr-msg" id="qrMsg">
          <div class="icon" id="msgIcon"></div>
          <div class="title" id="msgTitle"></div>
          <div class="body" id="msgBody"></div>
          <div class="hint" id="msgHint"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- QR生成: qrcode-generator@1.4.4 の qrcode.js を同梱（外部CDNに依存しない。SHA-384 は gas/kiosk.js のセットアップ用ページ（?p=kiosksetup）のSRIと同じ値で確認済み） -->
  <script src="qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
